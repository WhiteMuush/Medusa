name: Bug report
description: Something inside Medusa (menu, dispatcher, Docker plumbing, CLI installer) is broken.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please keep in mind that
        Medusa is a thin orchestrator around upstream tools — issues that
        reproduce only inside a deployed tool (Wazuh dashboard error,
        OpenCTI connector crash, ...) should generally go to that tool's
        own tracker.
  - type: input
    id: tool
    attributes:
      label: Affected tool (if any)
      description: Tool name as registered in `core.sh` (e.g. `wazuh`, `opencti`).
      placeholder: opencti
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact `medusa` invocation(s) that triggered the bug.
      placeholder: |
        1. `./medusa.sh`
        2. Select 1 (SOC) → 5 (opencti) → 1 (Deploy)
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `./medusa.sh check` is ideal. Otherwise OS, Docker version, Compose version.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of the failing command, or `./medusa.sh logs <tool>` if applicable. Please redact secrets.
      render: shell
